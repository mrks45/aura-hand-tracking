
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AURA Test</title>
</head>
<body style="background:#07111f;color:#00f0ff;text-align:center;font-family:Arial;padding:30px">
  <h1>AURA</h1>
  <p>JavaScript Button Test</p>
  <button id="test" style="padding:15px;font-size:18px">TEST BUTTON</button>
  <p id="status">Waiting...</p>

  <script>
    document.getElementById("test").addEventListener("click", function() {
      document.getElementById("status").textContent = "AURA JavaScript is working!";
      alert("Bhai, button working hai!");
    });
  </script>
</body>
</html>
