
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA | Hand Tracker</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #050b14;
      color: #00f0ff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 { letter-spacing: 5px; }
    p { color: #c8faff; }
    button {
      padding: 14px 22px;
      background: #00ddeb;
      color: #001018;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
    }
    #stage {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 18px auto;
      background: #101b2b;
      border: 1px solid #00ddeb;
      border-radius: 12px;
      overflow: hidden;
    }
    video, canvas {
      display: block;
      width: 100%;
      height: auto;
      transform: scaleX(-1);
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
    #status { color: #ffe082; }
  </style>
</head>
<body>
  <h1>AURA</h1>
  <p>GESTURE CONTROL SYSTEM</p>
  <p id="status">Ready to initialize...</p>
  <button id="start">START CAMERA</button>

  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <p id="count">Detected hands: 0</p>
  <p>Milestone: Live Hand Tracking</p>

  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";
      start.onclick = () => alert("AURA button is working!");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");
    const count = document.getElementById("count");
    const start = document.getElementById("start");

    let tracker;
    let running = false;
    let lastVideoTime = -1;

    start.addEventListener("click", async () => {
      start.disabled = true;
      status.textContent = "Loading hand tracker...";

      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );

        tracker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 2
        });

        status.textContent = "Requesting camera permission...";
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "user",
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        });

        video.srcObject = stream;
        await video.play();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        running = true;
        status.textContent = "AURA ONLINE — Show your hand!";
        start.textContent = "CAMERA RUNNING";
        requestAnimationFrame(detectFrame);
      } catch (error) {
        status.textContent = "Error: " + error.name + " — " + error.message;
        start.disabled = false;
      }
    });

    function detectFrame() {
      if (!running) return;

      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const result = tracker.detectForVideo(video, performance.now());

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const drawing = new DrawingUtils(ctx);

        if (result.landmarks) {
          for (const landmarks of result.landmarks) {
            drawing.drawConnectors(
              landmarks,
              HandLandmarker.HAND_CONNECTIONS,
              { color: "#00F0FF", lineWidth: 3 }
            );
            drawing.drawLandmarks(
              landmarks,
              { color: "#FF2BD6", lineWidth: 2, radius: 4 }
            );
          }
          count.textContent = "Detected hands: " + result.landmarks.length;
        }
      }

      requestAnimationFrame(detectFrame);
    }
  </script>
</body>
</html>
